
name: Compilar Jarvis para Android (APK)

on:
  push:
    branches:
      - principal
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças do Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Instalar componentes do Android
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair o projeto
        run: |
          if [ ! -f projeto.zip ]; then
            echo "ERRO: não encontrei projeto.zip na raiz do repositório."
            exit 1
          fi
          mkdir -p projeto
          unzip -oq projeto.zip -d projeto

      - name: Localizar o projeto Android
        id: localizar
        shell: bash
        run: |
          SETTINGS_FILE="$(find projeto -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRO: não encontrei settings.gradle ou settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Compilar APK de teste
        working-directory: ${{ steps.localizar.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: ${{ steps.localizar.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
